[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "sift-sec"
version = "0.1.0"
description = "Universal vulnerability scan normalizer and risk prioritizer enriched with CISA KEV and FIRST EPSS."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "sift contributors" },
]
keywords = [
    "security",
    "vulnerability-management",
    "cve",
    "epss",
    "cisa-kev",
    "nmap",
    "nuclei",
    "trivy",
    "appsec",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0,<1.0.0",
    "rich>=13.7.0,<15.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "platformdirs>=4.2.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-defusedxml>=0.7.0",
]

[project.scripts]
sift = "sift.cli:app"

[project.urls]
Homepage = "https://github.com/ahmad-muslim/sift"
Repository = "https://github.com/ahmad-muslim/sift"
Issues = "https://github.com/ahmad-muslim/sift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "httpx",
    "platformdirs",
    "typer",
    "rich",
    "rich.*",
    "defusedxml",
    "defusedxml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sift.cli"]
disallow_untyped_decorators = false
